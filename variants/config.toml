# Variant selection for user-global runtime installation.

default_variant = "codex"

[[variants]]
id = "codex"
name = "Default Codex"
home = "variants/codex/home"
default_home = "~/.codex"
policy_file = "AGENTS.md"
settings_file = "config.toml"
agent_format = "toml"

[[variants]]
id = "claude"
name = "Claude Agent"
home = "variants/claude/home"
default_home = "~/.claude"
launcher = "variants/claude/bin/claude"
launcher_name = "llm-claude"
policy_file = "CLAUDE.md"
settings_file = "settings.json"
agent_format = "markdown"

[[variants]]
id = "opencode"
name = "OpenCode"
home = "variants/opencode/home"
default_home = "~/.config/opencode"
launcher = "variants/opencode/bin/opencode"
launcher_name = "llm-opencode"
policy_file = "AGENTS.md"
settings_file = "opencode.json"
agent_format = "markdown"
