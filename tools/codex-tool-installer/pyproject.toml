[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-tool-installer"
version = "1.0.0"
description = "Safe installer and verifier for Codex development tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-tools = "codex_tool_installer.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
